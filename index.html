    <script>
      (function() {
        Promise.all([
          import('https://cdn.jsdelivr.net/gh/jscroot/api@0.0.7/croot.js').catch(() => ({})),
          import('https://cdn.jsdelivr.net/gh/jscroot/cookie@0.0.1/croot.js').catch(() => ({})),
          import('https://cdn.jsdelivr.net/gh/jscroot/element@0.1.5/croot.js').catch(() => ({})),
          import('https://cdn.jsdelivr.net/gh/jscroot/url@0.0.9/croot.js').catch(() => ({}))
        ]).then(function(modules) {
          var api = modules[0], cookie = modules[1], element = modules[2], url = modules[3];
          window.jscroot = Object.assign(window.jscroot || {}, api, cookie, element, url, {
            api: api,
            cookie: cookie,
            element: element,
            url: url
          });
          console.log("🚀 JSCroot (CRootJS) Micro-Framework Active & Ready on NoteRoute Portal:", window.jscroot);
        }).catch(function(err) {
          console.warn("JSCroot CDN load notice:", err);
        });
      })();
    </script>
